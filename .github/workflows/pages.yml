name: Deploy landing + app to GitHub Pages

# Deploys docs/ (the violet-house landing at / and the full SvelteKit app at
# /app) as a static artifact via GitHub Actions — NOT the legacy Jekyll builder,
# which strips SvelteKit's _app/ directory (underscore-prefixed) and breaks the app.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
